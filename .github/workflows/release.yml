name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: yarn
          cache-dependency-path: yarn.lock
          registry-url: https://npm.pkg.github.com
          scope: '@gopherex'
      - name: Validate tag and SDK version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[01]\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Invalid release tag')
          version = tag[1:]
          with open('sdk/ts/package.json') as source:
              assert json.load(source)['version'] == version, 'SDK version differs from tag'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: make node-deps build-sdk
      - name: Pack release assets
        run: |
          mkdir -p .build/release
          npm pack ./sdk/ts --pack-destination .build/release
          cp openapi/openapi.yaml .build/release/openapi.yaml
          cd .build/release
          sha256sum ./*.tgz openapi.yaml > SHA256SUMS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      # Republish-on-tag-recreate needs the existing version gone first; GitHub
      # Packages rejects re-publishing a live version. The automatic
      # GITHUB_TOKEN cannot delete packages (no delete:packages scope — the most
      # a workflow token gets is packages: write), so deletion only works when a
      # PAT with delete:packages is provided as the PACKAGES_TOKEN secret. When
      # it is absent we warn and let publish proceed (a first-time publish still
      # succeeds; a true re-publish then fails loudly below).
      - name: Delete existing version (allow republish on tag re-create)
        continue-on-error: true
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::PACKAGES_TOKEN not set; cannot delete existing version. Re-publishing an existing version will fail. Add a PAT with delete:packages as the PACKAGES_TOKEN secret."
            exit 0
          fi
          id="$(gh api --paginate "/orgs/${ORG}/packages/npm/${PKG}/versions" \
            --jq ".[] | select(.name == \"${VERSION}\") | .id" 2>/dev/null || true)"
          if [ -z "$id" ]; then
            echo "No existing ${PKG}@${VERSION}, nothing to delete"
            exit 0
          fi
          echo "Deleting existing ${PKG}@${VERSION} (version id ${id})"
          if ! gh api -X DELETE "/orgs/${ORG}/packages/npm/${PKG}/versions/${id}"; then
            echo "::warning::Failed to delete ${PKG}@${VERSION}; PACKAGES_TOKEN likely lacks delete:packages. Re-publish will fail."
          fi
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          ORG: ${{ github.repository_owner }}
          PKG: courier-sdk
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish SDK to GitHub Packages
        working-directory: sdk/ts
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update GitHub release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --target "$GITHUB_SHA"
            gh release upload "$RELEASE_TAG" .build/release/* --clobber
          else
            gh release create "$RELEASE_TAG" .build/release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
