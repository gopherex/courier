services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
      POSTGRES_DB: courier
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier -d courier"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
volumes:
  postgres:
